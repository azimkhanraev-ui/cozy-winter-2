<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Cozy Winter 2 — Настройки</title>
<style>
  :root { --bg: #152031; --panel: #1c2a40; --line: #2c3f5c; --text: #e6efff; --mute: #92a6c6; --acc: #7cc4ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  #preview { display: block; width: 100%; height: 150px; flex: 0 0 150px; border-bottom: 1px solid var(--line); }
  #app { flex: 1; overflow-y: auto; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px 6px; color: var(--mute); }
  .presets button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 4px 11px; cursor: pointer; font: inherit; font-size: 13px; }
  .presets button:hover { border-color: var(--acc); }
  nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: #111a29; position: sticky; top: 0; z-index: 2; }
  .tab { background: none; border: 0; color: var(--mute); padding: 7px 10px; border-radius: 8px 8px 0 0; cursor: pointer; font: inherit; font-size: 13px; }
  .tab.active { background: var(--panel); color: var(--text); }
  section { padding: 12px 18px 24px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  h2 { font-size: 17px; font-weight: 600; margin: 4px 0 10px; }
  .row { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .row.slider label { display: flex; justify-content: space-between; }
  .val { color: var(--acc); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); margin-top: 4px; }
  .row.check { display: flex; gap: 8px; align-items: center; }
  input[type=checkbox] { accent-color: var(--acc); width: 16px; height: 16px; }
  .row.select, .row.color, .row.hotkey { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  select, .hk input { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .hk { display: flex; align-items: center; gap: 8px; }
  .hk input { width: 150px; text-align: center; cursor: pointer; }
  .hk input:focus { outline: 2px solid var(--acc); }
  .hkst { min-width: 70px; color: #ffcf6b; font-size: 12px; }
  input[type=color] { width: 46px; height: 26px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 1px; }
  .row.note p { margin: 4px 0; color: var(--mute); font-size: 13px; }
  button { font: inherit; }
  .row.button button, .ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .row.button button:hover, .ghost:hover { border-color: var(--acc); }
  .row.button { border-bottom: 0; display: inline-block; margin-right: 8px; }
  .preset { margin-top: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .phases { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .ph { background: var(--panel); color: var(--mute); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .ph.active { color: var(--text); border-color: var(--acc); }
  .wp { padding: 4px 0 6px; }
  .wp-title { margin-bottom: 8px; }
  .wp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .wp-item { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 4px; cursor: pointer; color: var(--text); font: inherit; font-size: 12px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
  .wp-item canvas { width: 100%; height: auto; border-radius: 6px; display: block; }
  .wp-item.active, .wp-item:hover { border-color: var(--acc); }
  .wp-status { margin-top: 6px; color: var(--acc); min-height: 18px; font-size: 13px; }
  .wp-note { color: var(--mute); font-size: 12px; margin: 4px 0 0; }
</style>
</head>
<body>
<canvas id="preview"></canvas>
<div id="app"></div>
<script src="../dist/settings.js"></script>
</body>
</html>
